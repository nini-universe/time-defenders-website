<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타임 디펜더스 다운로드</title>
<meta name="description" content="타임 디펜더스 : 머지 & 디펜스 다운로드">
<meta property="og:title" content="타임 디펜더스 : 머지 & 디펜스">
<meta property="og:image" content="../img/og.jpg">
<meta name="theme-color" content="#0B131B">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0B131B; --panel: #15222E; --cream: #EDE6D6; --sub: #A9A493; --gold: #F2B623;
    --font: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  html[lang="ja"] { --font: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; font-family: var(--font); color: var(--cream); text-align: center;
    background: var(--night); position: relative; isolation: isolate;
  }
  body::before { content: ""; position: absolute; inset: 0; z-index: -1; background: url(../img/ui/topo.webp) center / 640px auto repeat; opacity: .55; }
  .box { max-width: 380px; width: 100%; }
  .icon { width: 132px; height: 132px; margin: 0 auto 20px; border-radius: 30px; box-shadow: 0 0 0 1px rgba(237,230,214,.2), 0 0 50px rgba(91,184,255,.3), 0 14px 30px rgba(0,0,0,.6); animation: pulse 3.4s ease-in-out infinite; }
  .wm { height: 22px; width: auto; margin: 0 auto; }
  h1 { margin-top: 10px; font-size: 18px; font-weight: 700; color: var(--sub); }
  .msg { margin-top: 22px; font-size: 17px; min-height: 1.6em; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  .btns { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 20px; border-radius: 12px; text-decoration: none; font-size: 16px; font-weight: 700;
  }
  .btn svg { width: 22px; height: 22px; }
  .btn.primary { background: var(--gold); color: #1A1206; }
  .btn.secondary { background: rgba(11,19,27,.7); color: var(--cream); border: 1px solid rgba(237,230,214,.35); }
  .hidden { display: none !important; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 1px rgba(237,230,214,.2), 0 0 36px rgba(91,184,255,.22), 0 14px 30px rgba(0,0,0,.6); } 50% { box-shadow: 0 0 0 1px rgba(237,230,214,.3), 0 0 70px rgba(91,184,255,.45), 0 14px 30px rgba(0,0,0,.6); } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .icon, .dots::after { animation: none; } }
</style>
<script src="/analytics.js"></script>
</head>
<body>
<div class="box">
  <img class="icon" src="../img/icon.webp" alt="">
  <img class="wm" src="../img/ui/wordmark.webp" alt="Time Defenders">
  <h1 id="name">타임 디펜더스 : 머지 & 디펜스</h1>

  <!-- 이동 중 안내 (아이폰 → App Store, 안드로이드 → Google Play) -->
  <p class="msg hidden" id="redirectMessage"><span id="redirectText">App Store로 이동 중</span><span class="dots"></span></p>

  <div class="btns" id="buttonGroup">
    <a class="btn primary" id="iosButton" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      <span id="iosLabel">App Store에서 다운로드</span>
    </a>
    <a class="btn primary" id="androidButton" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
      <span id="androidLabel">Google Play에서 다운로드</span>
    </a>
    <a class="btn secondary" id="siteButton" href="../"><span id="siteLabel">게임 소개 보기</span></a>
  </div>
</div>

<script>
  // ── 스토어 주소 ──
  const IOS_URL = 'https://apps.apple.com/app/id6759893172';
  const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.nini.timedefenders';

  const T = {
    ko: { name: '타임 디펜더스 : 머지 & 디펜스', title: '타임 디펜더스 다운로드',
          toIos: 'App Store로 이동 중', toPlay: 'Google Play로 이동 중',
          ios: 'App Store에서 다운로드', android: 'Google Play에서 다운로드', site: '게임 소개 보기' },
    en: { name: 'Time Defenders: Merge & Defense', title: 'Download Time Defenders',
          toIos: 'Opening the App Store', toPlay: 'Opening Google Play',
          ios: 'Download on the App Store', android: 'Get it on Google Play', site: 'See the game' },
    ja: { name: 'タイムディフェンダーズ：マージ＆ディフェンス', title: 'タイムディフェンダーズ ダウンロード',
          toIos: 'App Storeに移動しています', toPlay: 'Google Playに移動しています',
          ios: 'App Storeでダウンロード', android: 'Google Playで手に入れよう', site: 'ゲーム紹介を見る' },
  };

  function pickLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (T[q]) return q;
    const n = (navigator.language || 'ko').toLowerCase();
    if (n.startsWith('ja')) return 'ja';
    if (n.startsWith('ko')) return 'ko';
    return 'en';
  }

  // iPadOS는 데스크톱 사파리처럼 'Macintosh'로 자신을 밝힌다 — 터치 지원으로 가른다
  function detectDevice() {
    const ua = navigator.userAgent || navigator.vendor || '';
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
    if (/android/i.test(ua)) return 'android';
    return 'desktop';
  }

  const lang = pickLang(), t = T[lang], $ = id => document.getElementById(id);
  document.documentElement.lang = lang;
  document.title = t.title;
  $('name').textContent = t.name;
  $('iosLabel').textContent = t.ios;
  $('androidLabel').textContent = t.android;
  $('siteLabel').textContent = t.site;
  $('iosButton').href = IOS_URL;
  $('androidButton').href = PLAY_URL;
  $('siteButton').href = '../' + (lang === 'ko' ? '' : '?lang=' + lang);

  function goTo(url, text) {
    $('redirectText').textContent = text;
    $('redirectMessage').classList.remove('hidden');
    // 버튼은 숨기지 않는다 — 인스타·유튜브 앱 안 브라우저가 자동 이동을 막으면 직접 누르면 된다
    // GA(/analytics.js)가 store_click을 보낸 뒤 이동 — 스크립트가 안 올라왔으면 그냥 0.5초 뒤 이동
    if (window.niniStoreGo) niniStoreGo(url, 500, true);
    else setTimeout(() => { location.replace(url); }, 500);
  }

  const device = detectDevice();
  if (device === 'ios') goTo(IOS_URL, t.toIos);
  else if (device === 'android') goTo(PLAY_URL, t.toPlay);
  // 데스크톱: 자동 이동 없이 버튼만
</script>
</body>
</html>
